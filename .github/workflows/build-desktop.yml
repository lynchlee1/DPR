name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: PhotoSorter-macOS
            build_command: ./scripts/build-macos.command
            artifact_path: dist/PhotoSorter-macOS.zip
          - os: windows-2025
            artifact: PhotoSorter-Windows
            build_command: powershell -ExecutionPolicy Bypass -File scripts/build-windows.ps1
            artifact_path: dist/PhotoSorter-Windows.zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        shell: bash
        run: ${{ matrix.build_command }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: PhotoSorter-*
          path: release
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.zip \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
